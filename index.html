<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Weather Dashboard</h1>
    
    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button id="searchBtn">Search</button>
    </div>

    <!-- Loading Indicator -->
    <p id="loading" class="hidden">Fetching weather data...</p>

    <!-- Error Message Display -->
    <p id="errorMsg" class="error hidden"></p>

    <!-- Current Weather Container -->
    <div id="currentWeather" class="card hidden"></div>

    <!-- 5-Day Forecast Container -->
    <div id="forecast" class="forecast-container hidden"></div>
  </div>

  <script src="app.js"></script>
  <footer style="margin-top: 40px; text-align: center; color: #555; font-size: 14px; padding: 20px;">
  <p>Built by Akshaya Nair | μID: "akshayanair@mulearn"</p>
</footer>
</body>
</html>
